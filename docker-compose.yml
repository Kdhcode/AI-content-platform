# Local development stack for Phase 1.
# Frontend/backend are run from source (see README). Only stateful services are containerised.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aicontent
      POSTGRES_PASSWORD: aicontent
      POSTGRES_DB: aicontent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicontent -d aicontent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
