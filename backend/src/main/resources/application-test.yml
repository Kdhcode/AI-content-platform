# Used by integration tests (docker compose up -d; database aicontent_test is created by docker/init-test-db.sql)
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/aicontent_test}
    username: ${DB_USER:aicontent}
    password: ${DB_PASSWORD}   # 기본값 없음: 환경 변수로만 지정 (로컬 trust DB는 아무 값이나 가능)
    hikari:
      # ~10 differently configured test contexts stay cached at once; the default pool of 10 each would use up
      # PostgreSQL's max_connections (100), more so while a dev server is connected to the same instance
      maximum-pool-size: 5
app:
  worker:
    enabled: false          # tests drive JobWorker.runPending(...) synchronously
  news:
    scheduler-enabled: false
  ai:
    provider: stub
    embedding-guard-enabled: false   # all integration tests share aicontent_test; AiProviderGuardIntegrationTest covers it
  classifier:
    candidate-window-days: 36500   # fixtures use fixed 2026 dates; do not let the 30-day window age them out
