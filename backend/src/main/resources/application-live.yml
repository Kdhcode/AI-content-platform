# Opt-in real RSS sources. Limit the initial collection before enabling a paid AI provider.
app:
  news:
    scheduler-enabled: ${NEWS_SCHEDULER_ENABLED:false}
    max-articles-per-run: ${NEWS_MAX_ARTICLES_PER_RUN:3}
    sources:
      - name: yonhap-latest
        type: RSS
        base-url: https://www.yna.co.kr/rss/news.xml
        enabled: true
        interval-seconds: 600
        config:
          publisher: 연합뉴스
      - name: bbc-world
        type: RSS
        base-url: https://feeds.bbci.co.uk/news/world/rss.xml
        enabled: true
        interval-seconds: 600
        config:
          publisher: BBC News
