spring:
  application:
    name: ai-content-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aicontent}
    username: ${DB_USER:aicontent}
    password: ${DB_PASSWORD}   # 기본값 없음: 환경 변수로만 지정 (로컬 trust DB는 아무 값이나 가능)
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  main:
    banner-mode: off

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false   # Redis is optional (locks only); it must never take the service out of rotation

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

app:
  worker:
    enabled: true
    defer-delay-seconds: 30   # wait before a deferred job (e.g. LOCK_TIMEOUT) is due again
    max-defers: 20            # deferrals allowed before FAILED; they never consume retry_count
  news:
    scheduler-enabled: true
    sources: []            # use the live profile for real RSS sources
  ai:
    provider: ${AI_PROVIDER:none}       # none | stub | openai
    embedding-dimension: 1536
    # Cost estimate for ai_log.estimated_cost_usd. No price is set here on purpose: prices change, so enter the
    # current ones from the provider's pricing page in the untracked application-local.yml. Without a price the
    # cost stays NULL (never 0). A key matches the exact model name or, failing that, the longest prefix
    # (responses report dated names such as gpt-4o-mini-2024-07-18). Names containing a dot need "[...]".
    #   pricing:
    #     gpt-4o-mini: { input-per-million-usd: <USD>, output-per-million-usd: <USD> }
    #     text-embedding-3-small: { input-per-million-usd: <USD> }      # embeddings: input only
    #     "[gpt-4.1-mini]": { input-per-million-usd: <USD>, output-per-million-usd: <USD> }
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:60}
      max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:4096}
  lock:
    redis-enabled: ${LOCK_REDIS_ENABLED:false}
  retention:
    # Days to keep ai_log.response (raw model output). 0 = keep forever. The period is a policy decision (OPEN ITEM #8),
    # so nothing is cleared by default. Only the text is cleared; tokens, cost and model stay for the usage screen.
    ai-log-response-days: ${AI_LOG_RESPONSE_RETENTION_DAYS:0}
    batch-size: 1000
    interval-ms: 3600000
  issue-lifecycle:
    # ACTIVE issues with no new article and no change for this many days become CLOSED (audit log ISSUE_AUTO_CLOSE).
    # 0 = never. When an issue is "over" is a policy decision (OPEN ITEM #9). REVIEW issues are never auto-closed.
    # A closed issue is no longer a classification candidate, so keep this >= app.classifier.candidate-window-days (30)
    # unless follow-up articles should start new issues sooner.
    auto-close-after-days: ${ISSUE_AUTO_CLOSE_AFTER_DAYS:0}
    batch-size: 100
    interval-ms: 3600000
  admin:
    bootstrap-username: ${ADMIN_USERNAME:}
    bootstrap-password: ${ADMIN_PASSWORD:}
