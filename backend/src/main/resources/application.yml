spring:
  application:
    name: ai-content-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aicontent}
    username: ${DB_USER:aicontent}
    password: ${DB_PASSWORD:aicontent}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  main:
    banner-mode: off

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false   # Redis is optional (locks only); it must never take the service out of rotation

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

app:
  worker:
    enabled: true
  news:
    scheduler-enabled: true
    sources: []            # use the live profile for real RSS sources
  ai:
    provider: ${AI_PROVIDER:none}       # none | stub | openai
    embedding-dimension: 1536
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:60}
      max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:4096}
  lock:
    redis-enabled: ${LOCK_REDIS_ENABLED:false}
  admin:
    bootstrap-username: ${ADMIN_USERNAME:}
    bootstrap-password: ${ADMIN_PASSWORD:}
