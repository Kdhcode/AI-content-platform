# Minimal CI (docs/VERIFY.md "CI"). Builds and tests what runs without a real app server:
#   backend   JDK 21 + a throwaway PostgreSQL 16/pgvector service -> mvn test (all unit and integration tests)
#   admin-ui  npm ci -> typecheck -> next build -> offline checks (content session, auth client, write-target guard)
#   run-scripts  scripts/run/test-run-scripts.ps1 on Windows PowerShell 5.1 (the shell the run scripts target)
# No real RSS, no paid AI (tests use stub AI and a local mock server), no daily DB, no repository secrets: the DB
# password below exists only inside the CI service container.
name: CI

on:
  push:
  pull_request:

# A PR from a branch of this repository is already covered by that branch's push run (same commit), so only PRs
# from forks run on pull_request. A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aicontent
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: aicontent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aicontent -d aicontent_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/aicontent_test
      DB_USER: aicontent
      DB_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -B -ntp test
      - name: Upload test reports (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  admin-ui:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-ui
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # no browser checks run in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: verify:content-session (autosave queue, conflicts, limits = server constants)
        run: npm run verify:content-session
      - name: verify:auth-client (credentials and 401 handling)
        run: npm run verify:auth-client
      - name: verify:write-target (data-writing verify scripts refuse daily / unconfirmed targets before connecting)
        run: npm run verify:write-target

  run-scripts:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: test-run-scripts.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          .\scripts\run\test-run-scripts.ps1
